<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How DIGM frees GPU memory for more requests</title>
<desc id="d">Left: with a full KV cache, four requests fill GPU memory and two wait. Right: with DIGM, each request keeps only its important tokens, so six requests run in the same memory. Below: DIGM scores tokens per attention head, drops the least important, packs the rest and returns freed blocks to vLLM.</desc>
