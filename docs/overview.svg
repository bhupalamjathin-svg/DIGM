<circle cx="841" cy="406" r="11" fill="#0F1B2A"/><text x="841" y="411" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="862" y="411" font-size="16" fill="#0F1B2A">Pack the rest and free the memory</text>
